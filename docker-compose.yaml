services:

  api01:
    container_name: api01
    build: ./api
    environment:
      - MESSAGE=${NOMBRE}
    ports:
      - 3000:3000

  api02:
    container_name: api02
    build: ./api
    environment:
      - MESSAGE=${NOMBRE}
    ports:
      - 3001:3000

  api03:
    container_name: api03
    build: ./api
    environment:
      - MESSAGE=${NOMBRE}
    ports:
      - 3002:3000

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

  